<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href = './bootstrap.min.css'>
    <link rel ="style" href = './style.css'>
</head>
<body>
    <div>
        <!-- Navbar -->
        <div class = 'm-3'>
        <nav class = 'navbar navbar-expand-lg bg-light border rounded-5 m-2 border-dark'>
            <ul class = 'nav p-2'>
                <li class = 'nav-item m-1'>
                    <div class= 'border border-dark rounded-5' style = 'transition: background-color 0.1ms ease; color:aliceblue' onmouseover="this.style.backgroundColor= '#000000'" onmouseout="this.style.backgroundColor=''">
                        <button type = 'button rounded' class="btn" onclick="window.location.href='./Home.html';">Home</button>
                    </div>
                </li>
                <li class = 'nav-item m-1'>
                    <div class= 'border border-dark rounded-5' style = 'transition: background-color 0.1ms ease; color:aliceblue' onmouseover="this.style.backgroundColor= '#000000'" onmouseout="this.style.backgroundColor=''">
                        <button type = 'button rounded' class="btn" onclick="window.location.href='./experience.html';">Experience</button>
                    </div>
                </li>
                <li class = 'nav-item m-1'>
                    <div class= 'border border-dark rounded-5' style = 'transition: background-color 0.1ms ease; color:aliceblue' onmouseover="this.style.backgroundColor= '#000000'" onmouseout="this.style.backgroundColor=''">
                        <button type = 'button rounded' class="btn" onclick="window.location.href='./project.html';">Project</button>
                    </div>
                </li>
                <li class = 'nav-item m-1'>
                    <div class= 'border border-dark rounded-5' style = 'transition: background-color 0.1ms ease; color:aliceblue' onmouseover="this.style.backgroundColor= '#000000'" onmouseout="this.style.backgroundColor=''">
                        <button type = 'button rounded' class="btn" onclick="window.location.href='./contact.html';">Contact</button>
                    </div>
                </li>
            </ul>
            <ul class ='nav ms-auto'>
                <li class = 'nav-item m-3'>
                    <div class= 'border border-dark rounded-5' style = 'transition: background-color 0.1ms ease; color:greenyellow' onmouseover="this.style.backgroundColor= '#000000'" onmouseout="this.style.backgroundColor=''">
                        <button type = 'button rounded' class="btn" onclick="window.location.href='./fun.html';">More</button>
                    </div>
                </li>
            </ul>
        </nav></div>
    </div>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Get in Touch</h2>
                            <p class="text-muted">
                                I love to hear from you!
                            </p>
                        </div>

                        <form action="https://script.google.com/macros/s/AKfycbxqdfhnN4g0ItsgB_wlwFYFjbHD1vvKo3DIw8BNEvz2aRio8RkVCN853geg7aKsc836Cg/exec"
                            method="POST">

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">
                                    Name
                                </label>
                                <input type="text"
                                    class="form-control form-control-lg rounded-3"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Email Address
                                </label>
                                <input type="email"
                                    class="form-control form-control-lg rounded-3"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label fw-semibold">
                                    Message <span class="text-muted">(Optional)</span>
                                </label>
                                <textarea class="form-control rounded-3"
                                        id="message"
                                        name="message"
                                        rows="3"
                                        placeholder="Write your message..."></textarea>
                            </div>
                            <button type="submit"
                                    class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold">
                                Submit <i class="bi bi-send ms-2"></i>
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <footer class = 'bg-dark' style="color:white">
        <div class="row">
            <div class = 'd-flex align-items-center justify-content-center text-center' >
                Contact Links-
                    <a class= 'm-1' href ='https://www.linkedin.com/in/harshag2325/' alt="Linkedin">LinkedIn</a>
                    <a class= 'm-1' href ='mailto:harshagrawal2325@gmail.com' alt="gmail">Gmail</a>
            </div>
        </div>
        <div>Site Hosted on Github Pages</div>
    </footer>
</body>
</html>
